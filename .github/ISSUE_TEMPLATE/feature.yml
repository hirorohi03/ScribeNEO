name: "\U0001F680 Feature Request"
description: Suggest an idea or new feature for ScribeNEO.
title: "[FEATURE] <title>"
labels: ["enhancement"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Have a great idea? I'd love to hear it!
  - type: textarea
    id: problem
    attributes:
      label: "💡 Describe the feature you'd like to see."
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
